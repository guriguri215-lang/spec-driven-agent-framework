name: Continuous integration

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Verify exact triggering commit
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess;
          actual = subprocess.check_output(
          ['git', 'rev-parse', 'HEAD'], text=True).strip();
          expected = os.environ['EXPECTED_HEAD_SHA'];
          raise SystemExit(0 if actual == expected else
          f'checked-out HEAD {actual} does not match triggering SHA {expected}')"
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Install project without dependency resolution
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests
        run: python scripts/run_local_gate.py pytest
      - name: Measure total and M1 through M8 critical branch coverage
        run: python scripts/run_local_gate.py coverage
      - name: Run lint
        run: python scripts/run_local_gate.py ruff
      - name: Run type check
        run: python scripts/run_local_gate.py mypy
      - name: Validate M5 context evidence
        run: python scripts/run_local_gate.py script scripts/validate_m5_context.py
      - name: Validate M6 scheduler safety
        run: python scripts/run_local_gate.py script scripts/validate_m6_scheduler.py
      - name: Validate M7 solver evidence
        run: python scripts/run_local_gate.py script scripts/validate_m7_solver.py
      - name: Validate M8 workflow integration
        run: python scripts/run_local_gate.py script scripts/validate_m8_workflow.py
      - name: Run CLI smoke checks
        run: python scripts/run_local_gate.py script scripts/run_cli_smoke.py
      - name: Reproduce evaluation result
        run: python scripts/run_local_gate.py evaluation
      - name: Audit workspace boundary
        run: >-
          python scripts/run_local_gate.py workspace
          --expected-branch
          ${{ github.head_ref || github.ref_name }}
      - name: Audit publication candidate
        run: python scripts/run_local_gate.py publication
      - name: Audit dependency and license records
        run: python scripts/run_local_gate.py dependencies
      - name: Check installed dependency consistency
        run: python scripts/run_local_gate.py pip-check
