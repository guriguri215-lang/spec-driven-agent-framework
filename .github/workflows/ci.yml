name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Install project without dependency resolution
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Run tests
        run: python -m pytest
      - name: Run lint
        run: python -m ruff check src tests scripts
      - name: Run type check
        run: python -m mypy src tests scripts
      - name: Measure total branch coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=80
      - name: Check M1 critical coverage
        run: >-
          python -m coverage report
          --include="src/sdaqf/domain/models.py,src/sdaqf/domain/requirements.py,src/sdaqf/application/gates.py,src/sdaqf/application/approvals.py,src/sdaqf/application/baselines.py,src/sdaqf/application/comparison.py,src/sdaqf/application/planning.py,src/sdaqf/application/requirements.py,src/sdaqf/application/requirements_gate.py"
          --fail-under=90
      - name: Check M2 critical coverage
        run: >-
          python -m coverage report
          --include="src/sdaqf/domain/orchestration.py,src/sdaqf/domain/tooling.py,src/sdaqf/adapters/process.py,src/sdaqf/application/orchestration.py,src/sdaqf/application/skills.py,src/sdaqf/application/tooling.py,src/sdaqf/application/checkpoints.py"
          --fail-under=90
      - name: Check M6 critical coverage
        run: >-
          python -m coverage report
          --include="src/sdaqf/domain/scheduler.py,src/sdaqf/ports/scheduler.py,src/sdaqf/adapters/scheduler.py,src/sdaqf/application/scheduler_contracts.py,src/sdaqf/application/scheduler.py,src/sdaqf/application/scheduler_recovery.py,src/sdaqf/application/scheduler_simulation.py"
          --fail-under=90
      - name: Validate M6 scheduler safety
        run: python scripts/validate_m6_scheduler.py
      - name: Check M7 critical coverage
        run: >-
          python -m coverage report
          --include="src/sdaqf/domain/solver.py,src/sdaqf/ports/solver.py,src/sdaqf/adapters/solver.py,src/sdaqf/application/solver_contracts.py,src/sdaqf/application/solver.py,src/sdaqf/application/solver_verification.py"
          --fail-under=90
      - name: Validate M7 solver evidence
        run: python scripts/validate_m7_solver.py
      - name: Audit workspace boundary
        run: >-
          python scripts/check_workspace_boundary.py
          --repo .
          --expected-origin-url
          https://github.com/guriguri215-lang/spec-driven-agent-framework.git
      - name: Audit publication candidate
        run: python scripts/audit_repository.py --root . --workspace-parent ..
      - name: Audit dependency and license records
        run: python scripts/audit_dependencies.py --root .
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run CLI smoke checks
        run: python scripts/run_cli_smoke.py
